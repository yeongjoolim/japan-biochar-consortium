<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JBC 콘텐츠 관리</title>
<style>
:root{--ink:#16140f;--muted:#6f685a;--line:#e4ddcc;--paper:#f7f3ea;--card:#fffdf8;--ember:#d4622a;--char:#1d1b17;--leaf:#3f7d4e}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Noto Sans JP",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--char);color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:15px;margin-right:auto}
button,.btn{white-space:nowrap;font:600 13px inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
button.pri{background:var(--ember);border-color:var(--ember);color:#fff}button.dan{color:#b3261e}
header button,header .btn{background:#2f2c25;border-color:#3c382f;color:#fff}header button.pri{background:var(--ember);border-color:var(--ember)}
.tabs{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}.tabs button.on{background:var(--char);color:#fff;border-color:var(--char)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:16px 20px 40px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;align-self:start;max-height:calc(100vh - 170px);overflow-y:auto}
.list .top{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.list input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover{background:#f3eee2}.item.on{background:#fbe5d8}
.item small{color:var(--muted);display:block}
.ed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.ed h2{margin:0 0 16px;font-size:18px}
.f{margin-bottom:14px}.f label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;color:#3b372e}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:#fff}
.f textarea{min-height:90px;resize:vertical}.f textarea.big{min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.lg{font-size:11px;font-weight:700;color:#fff;background:var(--leaf);border-radius:4px;padding:1px 6px;margin-left:6px}.lg.en{background:#4f6d8a}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:500;cursor:pointer;background:#fff}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
.linkrow{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:6px;margin-bottom:6px}@media(max-width:700px){.linkrow{grid-template-columns:1fr}}
.linkrow input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}.modal form{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}.modal h3{margin:0}.modal input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}.modal .err{color:#b3261e;font-size:13px;min-height:1em}
.help{background:#fff8ee;border:1px solid #f1d9bf;border-radius:12px;padding:12px 16px;margin:14px 20px 0;font-size:13px}
</style>
</head>
<body>
<header>
  <b>JBC 콘텐츠 관리</b>
  <a class="btn" href="index.html?preview=1" target="_blank">미리보기 ↗</a>
  <button id="importBtn">파일 불러오기</button>
  <button class="pri" id="exportBtn">암호화해서 내보내기 (content.enc.js) ⬇</button>
  <input type="file" id="file" accept=".js,.json" hidden>
</header>
<div class="help">편집 내용은 이 브라우저에 자동으로 임시 저장됩니다. 사이트에 반영하려면 <b>[암호화해서 내보내기]</b>에서 회원 비밀번호를 넣고 받은 <code>content.enc.js</code>를 GitHub 저장소에 올려(덮어쓰기) 주세요. 이때 넣은 비밀번호가 사이트 접속 비밀번호가 됩니다. 본문 서식: <code>## 소제목</code>, <code>- 목록</code>, <code>[글자](URL)</code>, <code>![설명](이미지URL)</code>, <code>**굵게**</code>. 빈 줄을 넣으면 문단이 나뉩니다.</div>
<div class="tabs" id="tabs">
  <button data-t="posts" class="on">기사 (記事)</button>
  <button data-t="symposia">심포지엄</button>
  <button data-t="categories">연구회·카테고리</button>
  <button data-t="site">사이트 정보</button>
</div>
<div class="layout">
  <div class="list" id="list"></div>
  <div class="ed" id="ed"></div>
</div>
<div class="toast" id="toast"></div>
<script src="content.js"></script>
<script src="content.enc.js"></script>
<script src="assets/crypto.js"></script>
<script>
(function(){
  const KEY="jbc-admin-draft";
  let D; try{ D = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  const fresh = !D;
  if(!D && window.SITE_CONTENT) D = JSON.parse(JSON.stringify(window.SITE_CONTENT));
  let tab="posts", sel=null, filter="";
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}};
  const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)};
  const today=()=>new Date().toISOString().slice(0,10);
  const uid=p=>p+"-"+Date.now().toString(36);
  const bi=(o)=>o&&typeof o==="object"?o:{ja:o||"",en:""};

  function items(){
    if(tab==="posts") return (D.posts||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    if(tab==="symposia") return D.symposia||[];
    if(tab==="categories") return D.categories||[];
    return [];
  }
  function label(it){
    if(tab==="posts") return `${esc(it.title.ja||it.title.en||"(제목 없음)")}<small>${it.date||""} · ${(it.categories||[]).map(id=>{const c=D.categories.find(x=>x.id===id);return c?esc(c.ja):id}).join(", ")}</small>`;
    if(tab==="symposia") return `${esc(it.title.ja||"(제목 없음)")}<small>${it.year||"-"} · ${it.status==="upcoming"?"개최 예정":"지난 행사"}</small>`;
    return `${esc(it.ja)}<small>${it.type==="group"?"연구회":"기사 카테고리"} · ${esc(it.en)}</small>`;
  }
  function renderList(){
    const L=$("#list");
    if(tab==="site"){L.innerHTML=`<div class="item on">사이트 기본 정보</div>`;return}
    const q=filter.toLowerCase();
    const arr=items().filter(it=>!q||JSON.stringify(it).toLowerCase().includes(q));
    L.innerHTML=`<div class="top"><input id="flt" placeholder="검색" value="${esc(filter)}"><button class="pri" id="add">+ 새로</button></div>`+
      arr.map(it=>`<div class="item ${sel===it.id?"on":""}" data-id="${esc(it.id)}">${label(it)}</div>`).join("");
    $("#flt").oninput=e=>{filter=e.target.value;renderList();const f=$("#flt");f.focus();f.setSelectionRange(f.value.length,f.value.length)};
    $("#add").onclick=add;
    L.querySelectorAll(".item[data-id]").forEach(el=>el.onclick=()=>{sel=el.dataset.id;renderList();renderEd()});
  }
  function add(){
    let it;
    if(tab==="posts"){it={id:uid("post"),date:today(),categories:["news"],title:{ja:"",en:""},summary:{ja:"",en:""},body:{ja:"",en:""},cover:""};D.posts.unshift(it)}
    else if(tab==="symposia"){it={id:uid("sym"),year:String(new Date().getFullYear()+1),status:"upcoming",date:"",title:{ja:"",en:""},summary:{ja:"",en:""},body:{ja:"",en:""},links:[],cover:""};D.symposia.unshift(it)}
    else {it={id:uid("cat"),type:"group",ja:"新しい研究会",en:"New Working Group",desc:{ja:"",en:""}};D.categories.push(it)}
    sel=it.id;save();renderList();renderEd();
  }
  const fld=(lbl,name,val,type="input",hint="")=>`<div class="f"><label>${lbl}</label>${type==="textarea"?`<textarea name="${name}">${esc(val)}</textarea>`:type==="big"?`<textarea class="big" name="${name}">${esc(val)}</textarea>`:`<input name="${name}" value="${esc(val)}" ${type==="date"?'type="date"':""}>`}${hint?`<div class="hint">${hint}</div>`:""}</div>`;
  const pair=(lbl,name,obj,type)=>`<div class="two">${fld(lbl+'<span class="lg">日本語</span>',name+".ja",bi(obj).ja,type)}${fld(lbl+'<span class="lg en">English</span>',name+".en",bi(obj).en,type)}</div>`;

  function renderEd(){
    const E=$("#ed");
    if(tab==="site"){
      const S=D.site;
      E.innerHTML=`<h2>사이트 정보</h2><form id="frm">${pair("사이트 이름","name",S.name)}${pair("메인 문구 (히어로 제목)","tagline",S.tagline)}${pair("소개 문장","intro",S.intro,"textarea")}${fld("문의 이메일","email",S.email)}
      <div class="f"><label>숫자 지표 (히어로 하단)</label>${(S.stats||[]).map((s,i)=>`<div class="linkrow" style="grid-template-columns:.6fr .6fr 1fr 1fr"><input name="stats.${i}.value" value="${esc(s.value)}" placeholder="값(日)"><input name="stats.${i}.valueEn" value="${esc(s.valueEn||"")}" placeholder="값(EN, 비우면 같음)"><input name="stats.${i}.label.ja" value="${esc(s.label.ja)}" placeholder="라벨(日)"><input name="stats.${i}.label.en" value="${esc(s.label.en)}" placeholder="Label(EN)"></div>`).join("")}</div>
      <div class="bar"><button type="submit" class="pri">저장</button></div></form>`;
      $("#frm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);for(const[k,v]of fd)setPath(D.site,k,v);save();toast("저장했습니다")};
      return;
    }
    const it=items().find(x=>x.id===sel);
    if(!it){E.innerHTML=`<p style="color:var(--muted)">왼쪽 목록에서 항목을 고르거나 <b>+ 새로</b>를 눌러 추가하세요.</p>`;return}
    let h="";
    if(tab==="posts"){
      h=`<h2>기사 편집</h2><div class="two">${fld("날짜","date",it.date,"date")}${fld("ID (URL에 쓰임, 영문·숫자)","id",it.id)}</div>
      <div class="f"><label>카테고리 · 연구회 (여러 개 선택 가능)</label><div class="chips">${D.categories.map(c=>`<label><input type="checkbox" name="cat" value="${esc(c.id)}" ${(it.categories||[]).includes(c.id)?"checked":""}>${esc(c.ja)}</label>`).join("")}</div></div>
      ${pair("제목","title",it.title)}${pair("요약 (목록에 표시, 선택)","summary",it.summary,"textarea")}${pair("본문","body",it.body,"big")}
      ${fld("대표 이미지 URL (선택)","cover",it.cover,"input","비워 두면 카테고리 색상의 자동 이미지가 표시됩니다. 이미지 파일을 assets/img/ 폴더에 넣고 assets/img/파일명.jpg 처럼 적어도 됩니다.")}`;
    } else if(tab==="symposia"){
      h=`<h2>심포지엄 편집</h2><div class="two">${fld("연도","year",it.year)}<div class="f"><label>상태</label><select name="status"><option value="upcoming" ${it.status==="upcoming"?"selected":""}>개최 예정 (開催予定)</option><option value="past" ${it.status!=="upcoming"?"selected":""}>지난 행사</option></select></div></div>
      <div class="two">${fld("개최일 (선택)","date",it.date,"date")}${fld("ID","id",it.id)}</div>
      ${pair("제목","title",it.title)}${pair("요약","summary",it.summary,"textarea")}${pair("본문 (프로그램·장소 등)","body",it.body,"big")}
      <div class="f"><label>자료·녹화 링크</label><div id="links">${(it.links||[]).map((l,i)=>linkRow(l,i)).join("")}</div><button type="button" id="addLink">+ 링크 추가</button></div>
      ${fld("대표 이미지 URL (선택)","cover",it.cover)}`;
    } else {
      h=`<h2>연구회 · 카테고리 편집</h2><div class="two"><div class="f"><label>종류</label><select name="type"><option value="group" ${it.type==="group"?"selected":""}>연구회 (研究会 페이지에 표시)</option><option value="topic" ${it.type==="topic"?"selected":""}>기사 카테고리</option></select></div>${fld("ID","id",it.id,"input","바꾸면 기존 기사의 연결도 함께 바뀝니다.")}</div>
      <div class="two">${fld('이름<span class="lg">日本語</span>',"ja",it.ja)}${fld('이름<span class="lg en">English</span>',"en",it.en)}</div>${pair("설명 (연구회만)","desc",it.desc,"textarea")}`;
    }
    E.innerHTML=`<form id="frm">${h}<div class="bar"><button type="button" class="dan" id="del">삭제</button><button type="submit" class="pri">저장</button></div></form>`;
    const ad=$("#addLink"); if(ad) ad.onclick=()=>{$("#links").insertAdjacentHTML("beforeend",linkRow({label:{ja:"",en:""},url:""},Date.now()))};
    $("#ed").onclick=e=>{if(e.target.dataset.rm!==undefined)e.target.closest(".linkrow").remove()};
    $("#del").onclick=()=>{if(!confirm("이 항목을 삭제할까요?"))return;const arr=tab==="posts"?D.posts:tab==="symposia"?D.symposia:D.categories;arr.splice(arr.indexOf(it),1);sel=null;save();renderList();renderEd();toast("삭제했습니다")};
    $("#frm").onsubmit=e=>{e.preventDefault();
      const fd=new FormData(e.target), oldId=it.id;
      for(const[k,v]of fd){ if(k==="cat"||k.startsWith("link"))continue; setPath(it,k,v) }
      if(tab==="posts") it.categories=fd.getAll("cat");
      if(tab==="symposia"){ it.links=[...document.querySelectorAll(".linkrow")].map(r=>({label:{ja:r.querySelector('[data-k="ja"]').value,en:r.querySelector('[data-k="en"]').value},url:r.querySelector('[data-k="url"]').value})).filter(l=>l.url) }
      if(tab==="categories" && oldId!==it.id) D.posts.forEach(p=>p.categories=(p.categories||[]).map(c=>c===oldId?it.id:c));
      sel=it.id;save();renderList();toast("저장했습니다");
    };
  }
  const linkRow=(l,i)=>`<div class="linkrow"><input data-k="ja" value="${esc(l.label&&l.label.ja)}" placeholder="이름(日) 例: 講演資料"><input data-k="en" value="${esc(l.label&&l.label.en)}" placeholder="Label (EN)"><input data-k="url" value="${esc(l.url)}" placeholder="https://..."><button type="button" class="dan" data-rm>×</button></div>`;
  function setPath(o,path,v){const ks=path.split(".");let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null||typeof c[ks[i]]!=="object")c[ks[i]]={};c=c[ks[i]]}c[ks[ks.length-1]]=v}

  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;sel=null;filter="";document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));renderList();renderEd()};
  // 비밀번호 입력창 (confirm=true면 두 번 입력)
  function askPw(title,desc,confirm){return new Promise(res=>{
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<form><h3>${title}</h3><div style="color:var(--muted);font-size:13px">${desc}</div><input type="password" id="p1" placeholder="비밀번호" autocomplete="new-password" required>${confirm?'<input type="password" id="p2" placeholder="비밀번호 확인" autocomplete="new-password" required>':""}<div class="err" id="perr"></div><div class="bar"><button type="button" id="pc">취소</button><button class="pri" type="submit">확인</button></div></form>`;
    document.body.appendChild(m);m.querySelector("#p1").focus();
    m.querySelector("#pc").onclick=()=>{m.remove();res(null)};
    m.querySelector("form").onsubmit=e=>{e.preventDefault();const a=m.querySelector("#p1").value;
      if(confirm){if(a.length<8){m.querySelector("#perr").textContent="8자 이상으로 정해 주세요.";return}if(a!==m.querySelector("#p2").value){m.querySelector("#perr").textContent="두 비밀번호가 다릅니다.";return}}
      m.remove();res(a)};
  })}
  $("#exportBtn").onclick=async()=>{
    const pw=await askPw("회원 비밀번호 설정","이 비밀번호로 콘텐츠를 암호화합니다. 사이트 접속 비밀번호가 되며, 잊으면 복구할 수 없으니 따로 보관해 주세요.",true);
    if(!pw)return;
    const pack=await JBCCrypto.encrypt(D,pw);
    const txt="/* Japan Biochar Consortium – 암호화된 사이트 콘텐츠 ("+new Date().toLocaleString()+"). 직접 편집하지 말고 admin.html을 사용하세요. */\nwindow.SITE_ENC = "+JSON.stringify(pack)+";\n";
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/javascript"}));a.download="content.enc.js";a.click();toast("content.enc.js를 내려받았습니다");
  };
  $("#importBtn").onclick=()=>$("#file").click();
  $("#file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const s=await f.text();
    try{let j=JSON.parse(s.slice(s.indexOf("{"),s.lastIndexOf("}")+1));
      if(j.data&&j.salt){const pw=await askPw("비밀번호 입력","암호화된 파일입니다. 회원 비밀번호를 입력하세요.");if(!pw)return;try{j=(await JBCCrypto.decrypt(j,pw)).data}catch(x){alert("비밀번호가 다릅니다.");return}}
      if(!j.posts)throw 0;D=j;save();sel=null;renderList();renderEd();toast("불러왔습니다")}catch(err){alert("파일 형식을 읽을 수 없습니다.")}};
  async function init(){
    if(!D && window.SITE_ENC){
      while(!D){const pw=await askPw("비밀번호 입력","사이트에 올라가 있는 암호화된 콘텐츠를 불러옵니다. 회원 비밀번호를 입력하세요.");
        if(pw===null){D={site:{name:{ja:"",en:""},tagline:{ja:"",en:""},intro:{ja:"",en:""},email:"",stats:[]},categories:[],posts:[],symposia:[]};break}
        try{D=(await JBCCrypto.decrypt(window.SITE_ENC,pw)).data;save()}catch(x){alert("비밀번호가 다릅니다.")}}
    }
    if(!D) D={site:{name:{ja:"",en:""},tagline:{ja:"",en:""},intro:{ja:"",en:""},email:"",stats:[]},categories:[],posts:[],symposia:[]};
    if(!fresh) setTimeout(()=>toast("이전에 편집하던 초안을 불러왔습니다"),300);
    renderList();renderEd();
  }
  init();
})();
</script>
</body>
</html>
